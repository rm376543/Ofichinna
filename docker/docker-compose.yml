version: "3.9"  
  
services:  
  sqlserver:  
    image: mcr.microsoft.com/mssql/server:2022-latest  
    container_name: ofichina-sqlserver  
  
    environment:  
      ACCEPT_EULA: "Y"  
      MSSQL_SA_PASSWORD: "${Docker__SqlPassword}"  
  
    ports:  
      - "1433:1433"  
  
    volumes:  
      - sqlserver_data:/var/opt/mssql  
  
    restart: unless-stopped  
  
    networks:  
      - ofichina-network  
  
  postgres:  
    image: postgres:16  
    container_name: sonarqube-postgres  
  
    environment:  
      POSTGRES_USER: "${Sonar__Postgress_Username}"  
      POSTGRES_PASSWORD: "${Sonar__Postgress_Password}"  
      POSTGRES_DB: "${Sonar__Postgress_Database}"  
  
    volumes:  
      - postgres_data:/var/lib/postgresql/data  
  
    restart: unless-stopped  
  
    networks:  
      - ofichina-network  
  
  sonarqube:  
    image: sonarqube:community  
    container_name: sonarqube  
  
    depends_on:  
      - postgres  
  
    environment:  
      SONAR_JDBC_URL: "${Sonar__JDBC_URL}"  
      SONAR_JDBC_USERNAME: "${Sonar__Username}"  
      SONAR_JDBC_PASSWORD: "${Sonar__Password}"  
  
    ports:  
      - "9000:9000"  
  
    volumes:  
      - sonarqube_data:/opt/sonarqube/data  
      - sonarqube_extensions:/opt/sonarqube/extensions  
      - sonarqube_logs:/opt/sonarqube/logs  
  
    restart: unless-stopped  
  
    networks:  
      - ofichina-network  
  
  seq:  
    image: datalust/seq:latest  
    container_name: ofichina-seq  
  
    environment:  
      ACCEPT_EULA: "Y"  
      SEQ_FIRSTRUN_ADMINPASSWORD: "${Docker__Seq}"  
  
    ports:  
      - "5341:80"  
  
    volumes:  
      - seq_data:/data  
  
    restart: unless-stopped  
  
    networks:  
      - ofichina-network  
  
  api:  
    build:  
      context: ..  
      dockerfile: docker/Dockerfile  
  
    container_name: ofichina-api  
  
    depends_on:  
      - sqlserver  
  
    ports:  
      - "8080:8080"  
  
    env_file:  
      - ../.env  
  
    environment:  
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ofichinna;User Id=sa;Password=${Docker__SqlPassword};TrustServerCertificate=True"

    restart: unless-stopped  
  
    networks:  
      - ofichina-network  
  
volumes:  
  sqlserver_data:  
  postgres_data:  
  sonarqube_data:  
  sonarqube_extensions:  
  sonarqube_logs:  
  seq_data:  
  
networks:  
  ofichina-network:  
    driver: bridge